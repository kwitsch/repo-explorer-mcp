[package]
name = "repo-explorer-agent"
version.workspace = true
edition.workspace = true

[dependencies]
repo-explorer-core = { version = "0.1.0", path = "../repo-explorer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
repo-explorer-core = { version = "0.1.0", path = "../repo-explorer-core", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
