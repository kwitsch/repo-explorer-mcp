[package]
name = "repo-explorer-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
repo-explorer-core   = { version = "0.5.4", path = "../repo-explorer-core" }
repo-explorer-memory = { version = "0.5.4", path = "../repo-explorer-memory" }
repo-explorer-search = { version = "0.5.4", path = "../repo-explorer-search" }
repo-explorer-llm    = { version = "0.5.4", path = "../repo-explorer-llm" }
repo-explorer-agent  = { version = "0.5.4", path = "../repo-explorer-agent" }
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
bytes = "1"
semver = "1"
sha2 = "0.11"
hex = "0.4"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
self-replace = "1"
which = "8"
