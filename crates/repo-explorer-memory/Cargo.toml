[package]
name = "repo-explorer-memory"
version.workspace = true
edition.workspace = true

[dependencies]
repo-explorer-core = { version = "0.10.2", path = "../repo-explorer-core" }
rmcp = { version = "3.1.4", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
