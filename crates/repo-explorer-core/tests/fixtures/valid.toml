[llm]
cooldown_seconds = 90

[[llm.providers]]
name = "primary"
kind = "anthropic"
api_key_env = "REPO_EXPLORER_TEST_KEY_VALID"
models = ["claude-sonnet-4", "claude-haiku-4"]

[[llm.providers]]
name = "secondary"
kind = "openai"
api_key_env = "REPO_EXPLORER_TEST_KEY_VALID"
models = ["gpt-4o"]

[codebase_memory]
command = "codebase-memory-mcp"
args = ["--stdio"]

[search]
timeout_seconds = 45

[logging]
level = "debug"
