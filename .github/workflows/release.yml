name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Both legs upload to the same tag's release, and `action-gh-release`
      # creates it on first use — running them concurrently races on that
      # creation. One at a time keeps the upload deterministic.
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            bin: repo-explorer-mcp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            bin: repo-explorer-mcp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Derive version and guard against tag mismatch
        shell: bash
        run: |
          set -euo pipefail
          PKGID="$(cargo pkgid -p repo-explorer-mcp)"
          # cargo emits either `...#<version>` or `...#<name>@<version>`
          # depending on whether the package name matches its directory, so
          # strip up to the last `#` *or* `@`, whichever comes later.
          VERSION="${PKGID##*[#@]}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Workspace version: $VERSION"
          echo "Tag version:       $TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag version ($TAG_VERSION) does not match workspace version ($VERSION); refusing to release" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --package repo-explorer-mcp

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.bin }}"

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          "./dist/${{ matrix.bin }}" --version

      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="repo-explorer-mcp-${VERSION}-${{ matrix.target }}.${{ matrix.ext }}"
          tar -czf "dist/${ARCHIVE}" -C dist "${{ matrix.bin }}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "repo-explorer-mcp-$env:VERSION-${{ matrix.target }}.${{ matrix.ext }}"
          Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "dist/$archive" -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          cat "${ARCHIVE}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
