name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo build -p repo-explorer-mcp --no-default-features
      - run: cargo test -p repo-explorer-judge
      - run: cargo test -p repo-explorer-judge --features candle
      - run: cargo clippy -p repo-explorer-judge --features candle --all-targets -- -D warnings

  test-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm test

  test-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml numpy
      - run: python eval/test_score.py
      - run: python -m py_compile eval/run.py
      - run: python -m py_compile judge-serve/serve.py
      - run: python -m py_compile judge-serve/export_golden.py judge-serve/bench_http.py
      - run: python -m unittest discover -s train/laya/tests -t train/laya
      - run: python -m py_compile train/laya/bakeoff.py train/laya/prepare.py train/laya/train_ddp.py train/laya/calibrate.py train/laya/evaluate.py train/laya/judge_train/__init__.py train/laya/judge_train/constants.py train/laya/judge_train/data.py train/laya/judge_train/metrics.py train/laya/judge_train/logits.py

  test-gate:
    name: Test gate
    needs: [test, test-setup, test-eval]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: ${{ needs.test.result == 'success' && needs['test-setup'].result == 'success' && needs['test-eval'].result == 'success' && 'exit 0' || 'exit 1' }}
