# Pilot eval config (docs/eval/real-world-test-plan.md §3.2, §8.1).
#
# This is the live user config (~/.config/repo-explorer/repo-explorer.toml) verbatim, models
# array included. Earlier this pinned to a single dated model for cross-call determinism, but
# Gemini's rate limits aren't generous enough to carry a full eval pass on one model alone —
# so the eval now uses the real failover chain, same as production, and accepts that a run may
# span more than one model.
#
# The bare `command = "codebase-memory-mcp"` and the inert `prefer_rtk = true` (F-12 — not a
# real SearchConfig field, silently accepted) are kept exactly as the live config has them, per
# §3.2 ("keep prefer_rtk so F-12 is observed as-is").
#
# api_key_env only NAMES the environment variable; the harness never reads or copies the key
# itself, and this file is committed with that in mind.

[llm]
cooldown_seconds = 60

[[llm.providers]]
name = "gemini"
kind = "gemini"
api_key_env = "GOOGLE_API_KEY"
models = [
    "gemini-3.8-flash",
    "gemini-3.7-flash",
    "gemini-3.6-flash",
    "gemini-3.5-flash",
    "gemini-3.5-flash-lite",
    "gemini-3.1-flash-lite",
]

[codebase_memory]
command = "codebase-memory-mcp"
args = ["--stdio"]
staleness_seconds = 3600

[search]
timeout_seconds = 30
prefer_rtk = true

[logging]
level = "debug"
