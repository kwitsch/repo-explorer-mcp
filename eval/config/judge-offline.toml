# Judge OFFLINE (LLM-free) eval config (docs/judge.md, docs/eval/real-world-test-plan.md
# §3.2, §8.1).
#
# `default.toml` with the entire `[llm]` section REMOVED (and the inert `[search] prefer_rtk` key
# dropped), plus `[judge] mode = "on"` and `[agent] fallback = "off"`. This is the fully LLM-free
# configuration: Stage 4 is the local judge and Stage 5 synthesizes from disk-verified candidates
# instead of running the LLM fallback loop. No provider key is read or needed, so this run makes
# no external LLM calls at all.
#
# The judge is a local service: start an H2O shim / any `/v1/systemone` server on 127.0.0.1:8741
# before running (see docs/judge.md). `model` is not set, so the default applies. With no LLM
# configured there is no verification fallback, so a judge outage yields the offline Stage-5
# synthesis for every query.

[codebase_memory]
command = "codebase-memory-mcp"
args = ["--stdio"]
staleness_seconds = 3600

[search]
timeout_seconds = 30

[logging]
level = "debug"

[cache]
# The on-disk L2 is OFF for the harness, same as default.toml — passes must stay independent
# samples (see default.toml for the full rationale).
persistent = false

[judge]
mode = "on"
base_url = "http://127.0.0.1:8741"
select_threshold = 50

[agent]
fallback = "off"
