# Query corpus for the `self` repo (docs/eval/real-world-test-plan.md §6.3).
# Pin: 91eebde05c9cf761d1226c8658994edbf18e872c (~/repos/eval-corpus/self).
# Ground truth verified against that exact pin on 2026-09-05 (Phase 0). Every query carries
# scope_hint: crates — this repo's own docs/eval/ and eval/ directories contain every query
# string and expected path verbatim, and `rg` searches untracked files too (§3.2 corpus
# contamination rule), so the search space is restricted to crates/ to keep the run honest.

- id: self-P1-01
  cat: P1
  lang: en
  query: "where is derive_patterns defined"
  scope_hint: crates
  expect:
    primary_mode: all
    primary:
      - { path: crates/repo-explorer-core/src/retrieval.rs, symbol: derive_patterns, span: [150, 215] }
  notes: "21 grep hits for 'derive_patterns' concentrated in retrieval.rs — grep leg should survive; early-exit expected. span is the full function body (150-215), confirmed live during Phase-0 harness validation: the tool correctly returns the whole function, and a def-line-only span [150,150] would wrongly fail range_hit's 3x/40-line cap"

